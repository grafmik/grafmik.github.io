<div class="header">
  <h1 class="title">{{site.data.data.name}}</h1>
  <div class="header-actions">
    <button class="print-button" onclick="window.print()" title="Imprimer ou enregistrer en PDF"><i data-feather="printer"></i></button>
    {% if site.data.data.support_dark_mode%}
    <input type="checkbox" id="switch" name="mode" class="toggle-dark"></input>
    <label for="switch"><i id="moon" data-feather="moon" fill="var(--fg-color)"></i></label>
    {%endif%}
  </div>
</div>
<div class="header2">
  <h2 class="description">{{site.data.data.description}}</h2>
</div>

{% assign languages = cv.languages %}
{% if languages %}
<section class="languages">
    <h2 class="title">{{cv.labels.languages}}</h2>
    <div class="language-list">
        {% for lang in languages %}
        <div class="language-item">
            <span class="idiom">{{lang.idiom}}</span>
            <span class="level">{{lang.level}}</span>
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}

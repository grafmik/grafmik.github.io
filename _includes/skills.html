{% assign skills = cv.skills %}
{% if skills %}
<section class="skills">
    {% for sks in skills %}
    <div class="title">{{ cv.labels.skills | replace: '%', sks.category }}</div>
    {% for sk in sks.skill%}
    <div class="skill">{{sk}}</div>
    {% endfor %}
    {% endfor %}
</section>
{% endif %}

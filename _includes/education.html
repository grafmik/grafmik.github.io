{% assign education = cv.education %}
{% if education %}
<section class="education">
    <h2 class="title">{{cv.labels.education}}</h2>
    {% for ed in education %}
    <div class="education-item">
        <span class="degree">{{ed.degree}}</span>
        <span class="university">{{ed.university}}</span>
        <span class="time">{{ed.time}}</span>
    </div>
    {% endfor %}
</section>
{% endif %}
